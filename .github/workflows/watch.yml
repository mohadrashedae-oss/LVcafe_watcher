name: SevenRooms Watcher

on:
  schedule:
    - cron: "*/5 * * * *"   # كل ٥ دقائق تقريباً
  workflow_dispatch:         # يسمح لك تشغّله يدوياً بزر من GitHub لو تبي تجربه فوراً

jobs:
  check-availability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python sevenrooms_watcher.py
