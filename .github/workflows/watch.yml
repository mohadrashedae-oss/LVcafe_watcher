name: SevenRooms Watcher Automation

on:
  schedule:
    # يعمل كل 10 دقائق (تفادياً لاستنزاف دقائق GitHub المجانية بسرعة)
    - cron: '*/10 * * * *'
  workflow_dispatch: # يتيح لك التشغيل اليدوي للتجربة في أي وقت

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Availability Check
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python sevenrooms_watcher.py
